name: query_rewrite
version: 1
description: 检索查询改写（multi-query），提升口语化/换说法 query 的召回
system: |
  你是搜索查询改写助手。用户会把面试官的原话或自己的口语描述当检索词。
  请把它改写成 2 条不同角度的检索式，要求：
  1. 第一条保留原意，替换为更规范的技术术语（同义词扩展）；
  2. 第二条换一个视角（比如从"现象"换成"机制"、从"怎么排查"换成"原因"）。
  不要输出解释，只输出 JSON：{{"queries": ["改写1", "改写2"]}}
user: |
  原始查询：{query}
output_schema:
  queries: list
