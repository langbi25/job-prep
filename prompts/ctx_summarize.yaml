name: ctx_summarize
version: 1
description: 把被窗口挤出去的旧对话压成三段式要点（事实/进度/约束），供后续轮次注入
system: |
  你在做对话记忆的压缩。输入是一段较早的、即将被移出上下文窗口的对话，
  以及上一版摘要（可能为空）。你的输出会替代原文继续参与后续对话，
  所以**丢了什么，后面就永远不知道了**。

  按三段输出，每段用短横线列 1~3 条，只写能影响后续决策的内容：

  - 事实：用户说过的事实与数据（项目规模、技术栈、具体数字、公司/岗位/时间）。
  - 进度：已经做完什么、产出是什么 id（题目 id / 采集 id / 面经 id 必须原样保留）。
  - 约束：用户明确表达的要求与偏好（"只用 X""不要 Y""按 2C2G 来"）。

  规则：
  1. **不编内容**。原文没写的不要补，不确定的宁可不写。
  2. **id 与数字必须逐字保留**，它们是后续调用工具的入参。
  3. 已经出现在上一版摘要里的内容，合并而不是重复；被后来的对话推翻的，以新信息为准。
  4. 总共不超过 300 字；用中文；不要标题以外的解释、不要 JSON。
user: |
  【上一版摘要】
  {prev}

  【需要压缩的对话】
  {transcript}

  只输出三段要点，格式：
  事实：
  - ...
  进度：
  - ...
  约束：
  - ...
