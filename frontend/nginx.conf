server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # hash 文件名的静态资源：内容变了名字就变，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代：proxy_pass 不带路径 = URI 原样透传，后端无感知
    location /api/ {
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 编排类接口跑 LLM（实测一轮可到分钟级），比 nginx 默认 60s 宽裕
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 路由若在 /api 之外（chat 流式）也透传；目前全在 /api 下
    location = /health { proxy_pass http://api:8765; }
    location = /ingest { proxy_pass http://api:8765; }

    # SPA 兜底：hash 路由其实不需要，但留着以防未来换 history 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
