services:
  api:
    build: .
    image: job-prep-api:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8765 --workers 1
    env_file: .env
    environment:
      HF_ENDPOINT: https://hf-mirror.com
      # 容器默认 UTC。不设这个，span 的 start_ts 会比本地早 8 小时，
      # 混进历史数据（本地时区写入）后 trace 列表按时间排序全乱，
      # "按天统计"也会把晚上 8 点之后的数据算到前一天。
      TZ: Asia/Shanghai
      BACKUP_DIR: /backup
      BACKUP_KEEP: "7"
    ports:
      - "8765:8765"
    volumes:
      # 数据库放 named volume 而不是 ./data 绑定挂载：
      # WSL2 的 /mnt/e 走 9p，SQLite 的 WAL 在这种文件系统上会随机报
      # "database is locked"，写入吞吐也掉一个数量级。代价是备份要
      # 走 docker cp（命令见 docs/容器运行.md），不能直接拷目录。
      # 备份落宿主目录而不是卷里：卷损坏时卷内的备份也一起没了。
      # 目录在 E 盘，备份是低频顺序写，9p 的性能问题在这里不成立。
      - ./backups:/backup
      - jobprep_data:/app/data
      - ./knowledge:/app/knowledge
      - ./interviews:/app/interviews
      - ./inbox:/app/inbox
      - ./reports:/app/reports
      - ./evals:/app/evals
      - model_cache:/root/.cache/huggingface/hub
    # SQLite 单写者：多 worker 只会互相抢写锁，永远用 1 个
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # 首次启动要建库 + 加载向量模型，给足时间
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
    networks:
      - default
      - obs   # 与 deploy/langfuse 共享：容器间用服务名 langfuse-web 访问，不走宿主端口

  # 每日备份 sidecar：与 api 同镜像，只跑备份循环。
  # 独立成容器而不是塞进 api 的进程里——备份失败/卡住不影响在线服务，
  # 反过来 api 频繁重启也不会把备份节奏打乱。
  backup:
    build: .
    image: job-prep-api:latest
    command: python scripts/backup_loop.py
    environment:
      TZ: Asia/Shanghai
      BACKUP_DIR: /backup
      BACKUP_KEEP: "7"
      BACKUP_AT_HOUR: "2"
    volumes:
      - ./backups:/backup
      # 注意：必须是读写挂载。WAL 模式下即使只是读，SQLite 也要建 -shm 共享内存文件，
      # 挂 :ro 会直接 "unable to open database file"。脚本本身只用 mode=ro 打开，
      # 写权限仅用于 -shm/-wal 的映射。
      - jobprep_data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    restart: unless-stopped

  # MCP HTTP 服务（**可选**）：让 Claude Desktop / Cursor 这类外部客户端远程接入。
  #
  # 默认不启动——`docker compose up -d` 不会拉起它，必须显式
  #   docker compose --profile mcp up -d
  # 理由：多一个常驻进程就多一个故障面，而绝大多数时候只用内置对话。
  # 启用前必须在 .env 设 MCP_TOKEN（server.py 对非本地地址强制要求，
  # 没设会直接退出并打印原因——宁可起不来，也不要静默裸奔）。
  mcp:
    build: .
    image: job-prep-api:latest
    command: python -m app.mcp.server --http --host 0.0.0.0 --port 8766
    profiles: ["mcp"]
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      HF_ENDPOINT: https://hf-mirror.com
    ports:
      # 只绑宿主的 127.0.0.1：端口映射仅服务本机的 MCP 客户端，外部网络看不到。
      # 要跨机接入就改成 "8766:8766"，但那时 MCP_TOKEN 必须是长随机串。
      - "127.0.0.1:8766:8766"
    volumes:
      # 必须读写：写工具（draft_cards / ingest_text）要落库，WAL 还要建 -shm。
      - jobprep_data:/app/data
      - ./knowledge:/app/knowledge
      - ./interviews:/app/interviews
      - ./inbox:/app/inbox
      - ./reports:/app/reports
      - ./evals:/app/evals
      # search_kb 走向量检索，没有这个卷会重新下载几百 MB 模型
      - model_cache:/root/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8766),2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    # 不无限重启：token 缺失这类错误重启一百次也一样，让它在日志里停住更省事
    restart: on-failure:3
    networks:
      - default
      - obs   # 与 api 一致：MCP 的工具调用也要能导出 span


networks:
  obs:
    external: true

volumes:
  jobprep_data:
  model_cache:
